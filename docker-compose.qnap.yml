# QNAP Container Station 部署配置
# 注意：不要使用 version 字段（新版 Docker Compose 已废弃）
# 注意：env_file 必须用绝对路径，Container Station 不会按 YAML 位置解析相对路径
# 前后端分离架构：Nginx(前端:80) + FastAPI(后端:8000)

services:
  # ── 后端服务 ──────────────────────────────────────────────────────────
  backend:
    # GHCR 远程镜像 — 替换 <OWNER> 为你的 GitHub 用户名
    image: ghcr.io/kelvinguo1988/ai_fund_assistant/backend:latest
    container_name: ai-fund-backend
    restart: unless-stopped
    # 与 frontend 同处自定义桥接网络，供 Docker DNS 解析服务名 backend
    networks:
      - fund-quant-network

    # ⚠️ 必须使用绝对路径！Container Station 会将相对路径解析到 /tmp/
    # 请将下方路径改为你的 .env 实际位置
    env_file:
      - /share/Container/AI_Fund_Assistant/.env
    environment:
      - FUND_QUANT_HOST=0.0.0.0
      - FUND_QUANT_PORT=8000
      - FUND_QUANT_DATABASE_DIR=/app/data
      - FUND_QUANT_DATABASE_NAME=fund_quant.db
      - TZ=Asia/Shanghai

    # 持久化数据库
    volumes:
      - /share/Container/AI_Fund_Assistant/data:/app/data
      # 基金名称缓存（与生产 compose 一致，可写挂载避免容器重建丢失缓存）
      - /share/Container/AI_Fund_Assistant/fund_name_cache.json:/app/fund_name_cache.json

    expose:
      - "8000"

    # 日志配置（防止日志无限增长占满NAS存储）
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"

  # ── 前端服务 ──────────────────────────────────────────────────────────
  frontend:
    # GHCR 远程镜像 — 替换 <OWNER> 为你的 GitHub 用户名
    image: ghcr.io/kelvinguo1988/ai_fund_assistant/frontend:latest
    container_name: ai-fund-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    # 与 backend 同处自定义桥接网络；不使用 links（Container Station 不支持，
    # 且会导致 backend 不可解析 / 502）。nginx 经 Docker 内置 DNS 直连 backend。
    networks:
      - fund-quant-network

    # 日志配置（防止日志无限增长占满NAS存储）
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"

# ── 自定义桥接网络：前后端共享，供 Docker 内置 DNS 解析服务名 ────────────
networks:
  fund-quant-network:
    driver: bridge
