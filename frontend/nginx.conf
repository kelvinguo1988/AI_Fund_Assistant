# ============================================================================
# 基金量化交易系统 — Nginx 配置
# 功能: 静态文件服务 + API 反向代理 + SPA 路由回退 + Gzip 压缩
# ============================================================================

server {
    listen       80;
    listen       [::]:80;
    server_name  _;

    # ── 后端 upstream 变量化 + Docker 内置 DNS 延迟解析 ────────────────
    # 2026-08-23 修复：原硬编码 proxy_pass http://backend:8000 在启动时
    # 立即解析主机名，backend 不可解析（QNAP 不支持 host-gateway 且
    # links 被忽略）时 nginx [emerg] host not found in upstream 直接
    # 退出 → 容器崩溃循环。改为 set 变量后 nginx 启动时不解析，
    # 运行时经 resolver（Docker 嵌入式 DNS 127.0.0.11）动态解析；
    # 40-backend-wait.sh 兜底时会将 backend 替换为网关 IP 字面量，
    # IP 直连不走 resolver，三种场景下 nginx 均能正常启动。
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend_upstream "http://backend:8000";

    root   /usr/share/nginx/html;
    index  index.html;

    # ── Gzip 压缩 ──────────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/x-javascript
        application/json
        application/xml
        application/rss+xml
        image/svg+xml;

    # ── API 反向代理 → 后端容器（变量化，启动时不解析 backend）─────────
    location /api/ {
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket 支持（如有需要）
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # 超时设置
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 600s;
    }

    # ── 健康检查反向代理（URI /health 原样传递，与原行为等价）─────────
    location /health {
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── 静态资源缓存 ──────────────────────────────────────────────────
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ── SPA 路由回退 ────────────────────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── 错误页面 ───────────────────────────────────────────────────────
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
