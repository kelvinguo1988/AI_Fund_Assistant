# ============================================================================
# 基金量化交易系统 — Docker Compose 生产模式
# 前后端分离架构：Nginx(前端) + FastAPI(后端)
# 使用方式: docker compose up -d
# ============================================================================
#
# QNAP Container Station 兼容说明：
# - 前后端置于同一自定义桥接网络 fund-quant-network，依靠 Docker 内置
#   DNS（127.0.0.11）解析服务名 backend，不依赖 host-gateway / links
#   （Container Station 均不支持，会导致 backend 不可解析 / 502）。
# - nginx 通过 resolver 127.0.0.11 在运行时动态解析 backend，直连容器
#   网络，绝不经由宿主机网关 IP（容器间经网关不可达，会 Connection refused）。
# ============================================================================

services:
  # ── 后端服务 ──────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: fund-quant-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - FUND_QUANT_HOST=0.0.0.0
      - FUND_QUANT_PORT=8000
      - FUND_QUANT_DATABASE_DIR=/app/data
      - FUND_QUANT_DATABASE_NAME=fund_quant.db
      - TZ=Asia/Shanghai
    volumes:
      - ./data:/app/data
      # 基金名称缓存文件（19699 只基金名称映射，避免容器启动时重新拉取）
      # 可写挂载：容器内新增基金的名称缓存可持久化更新
      - ./fund_name_cache.json:/app/fund_name_cache.json
    expose:
      - "8000"
    # Container Station 兼容：frontend 通过 Docker 网关 IP + 本端口访问 backend
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

    # 日志配置（防止日志无限增长）
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"

    # 与 frontend 同处自定义桥接网络，供 Docker DNS 解析服务名 backend
    networks:
      - fund-quant-network

  # ── 前端服务 ──────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: fund-quant-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    # 与 backend 同处自定义桥接网络；不再使用 host-gateway / links
    # （Container Station 不支持，会导致 backend 不可解析 / 502）。
    # nginx 经 Docker 内置 DNS（127.0.0.11）在运行时解析 backend 并直连。
    networks:
      - fund-quant-network

    # 日志配置（防止日志无限增长）
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"

# ── 自定义桥接网络：前后端共享，供 Docker 内置 DNS 解析服务名 ────────────
networks:
  fund-quant-network:
    driver: bridge
